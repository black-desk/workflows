name: Automatic release via goreleaser

description: |-
  Release Go and Rust projects with GoReleaser, optionally publishing to crates.io.

  This action requires following permissions:
    contents: write
    id-token: write # (only when publish-crate is enabled)

author: Chen Linxuan

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  working-directory:
    description: |-
      Directory containing the GoReleaser configuration and project version
      script or Cargo package. Defaults to the repository root. Cargo
      publication, when enabled, uses the package in this same directory.
    required: false
    default: "."

  publish-crate:
    description: Publish the Cargo package to crates.io using Trusted Publishing after GoReleaser succeeds.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Exclude generated Zig cache from release inputs
      shell: bash
      run: |
        # setup-zig@v2 restores and writes .zig-cache in the checkout.
        # Keep its cross-run cache without making GoReleaser reject a dirty
        # worktree or letting Cargo package the cache. Use local Git metadata
        # so no tracked project file needs to change.
        printf '\n# Generated by setup-zig; not a release input.\n/.zig-cache/\n' >> "$(git rev-parse --git-path info/exclude)"

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Zig toolchain
      uses: mlugg/setup-zig@v2

    - name: Set up Go
      if: hashFiles(format('{0}/go.mod', inputs.working-directory)) != ''
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache: ${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) != '' }}
        cache-dependency-path: ${{ github.workspace }}/${{ inputs.working-directory }}/go.sum

    - if: github.event_name == 'push' && github.ref_type == 'branch'
      id: tag
      name: Generate new version tag if any
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        PUBLISH_CRATE: ${{ inputs.publish-crate }}
      run: |
        if [ "${RUNNER_DEBUG:-}" = "1" ] && command -v tree >/dev/null 2>&1; then
          tree
        fi

        script="./scripts/get-project-version.sh"
        if [ ! -f "$script" ]; then
          script="./tools/get-project-version.sh"
        fi

        if [ -f "$script" ]; then
          echo "Using script: $script"
          version="$("$script")"
        elif [ -f "Cargo.toml" ]; then
          echo "Using cargo to get version"
          if ! version="v$(cargo pkgid --locked | awk -F'[#@]' '{print $NF}')"; then
            echo "::error::Failed to parse version from \`cargo pkgid\`. In a workspace, ensure there is a single root package or provide ./scripts/get-project-version.sh."
            exit 1
          fi
        else
          echo "::error::Failed to determine project version. Tried ./scripts/get-project-version.sh, ./tools/get-project-version.sh, and Cargo.toml."
          exit 1
        fi

        # SemVer 2.0.0 (https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string)
        # Split the regex into components for readability. Numeric identifiers
        # must not have leading zeros; build metadata may contain them.
        number='(0|[1-9][0-9]*)'
        prerelease='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
        build='[0-9a-zA-Z-]+'
        semver="^v${number}\.${number}\.${number}(-${prerelease}(\.${prerelease})*)?(\+${build}(\.${build})*)?$"
        if [[ ! "$version" =~ $semver ]]; then
          echo "::error::Project version must be a v-prefixed SemVer 2.0.0 tag (for example v1.2.3 or v1.2.3-rc.1)."
          exit 1
        fi

        if [ "$PUBLISH_CRATE" = "true" ]; then
          crate_version="v$(cargo pkgid --locked | awk -F'[#@]' '{print $NF}')"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::Release tag must match Cargo package version $crate_version."
            exit 1
          fi
        fi

        if git show-ref --verify --quiet "refs/tags/$version"; then
          if [ "$(git rev-parse "refs/tags/$version^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $version already exists at a different commit; skipping release."
            exit 0
          fi
          echo "Tag $version already exists at this commit; retrying release."
        else
          git tag "$version"
        fi
        git push origin "refs/tags/$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - if: steps.tag.outputs.version != ''
      uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: latest
        args: release --clean
        workdir: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CUSTOM_TAG: ${{ steps.tag.outputs.version }}

    - if: inputs.publish-crate == 'true' && steps.tag.outputs.version != ''
      id: crate
      name: Check whether the Cargo package is already published
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        metadata="$(cargo metadata --locked --no-deps --format-version 1)"
        package="$(jq -ce --arg manifest "$(pwd -P)/Cargo.toml" \
          '[.packages[] | select(.manifest_path == $manifest)] | if length == 1 then .[0] else error("Select a single Cargo package using working-directory") end' <<< "$metadata")"
        name="$(jq -r '.name' <<< "$package")"
        version="$(jq -r '.version' <<< "$package")"
        response="$(mktemp)"
        trap 'rm -f "$response"' EXIT
        # cargo info fails both when a version is absent and when the registry
        # cannot be reached; its exit status cannot distinguish those cases.
        # Query the API so only HTTP 404 means unpublished. Other errors must
        # fail the job rather than trigger publication after a failed lookup.
        status="$(curl --silent --show-error --location --retry 3 \
          --user-agent black-desk-workflows-goreleaser \
          --output "$response" --write-out '%{http_code}' \
          "https://crates.io/api/v1/crates/$name/$version")"
        case "$status" in
          200)
            jq -e --arg version "$version" '.version.num == $version' "$response" >/dev/null
            echo "$name $version is already published; skipping cargo publish."
            ;;
          404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::crates.io returned HTTP $status"; exit 1 ;;
        esac

    - if: steps.crate.outputs.publish == 'true'
      name: Authenticate to crates.io via trusted publishing
      uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - if: steps.crate.outputs.publish == 'true'
      name: Publish to crates.io
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
